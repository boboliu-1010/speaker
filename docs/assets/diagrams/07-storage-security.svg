<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="970" viewBox="0 0 1280 970">
<title>两个服务的文件访问边界</title>
<rect width="1280" height="970" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">两个服务的文件访问边界</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">同一本机文件系统；按目录和接口控制所有权，不设置磁盘副本。</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="150" width="380" height="280" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="150" width="5" height="280" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="62" y="184" font-size="21" font-weight="600" fill="#17283f">Clip Server</text>
<text x="62" y="220" font-size="18" font-weight="400" fill="#607088">只读设备授权和离线模型</text>
<text x="62" y="248" font-size="18" font-weight="400" fill="#607088">写raw、片段WAV和逐段转写</text>
<text x="62" y="276" font-size="18" font-weight="400" fill="#607088">写recording / job处理状态</text>
<text x="62" y="304" font-size="18" font-weight="400" fill="#607088">合并完整WAV / VTT / MD</text>
<text x="62" y="332" font-size="18" font-weight="400" fill="#607088">发布manifest和current</text>
<text x="62" y="360" font-size="18" font-weight="400" fill="#607088">不连接用户与设备数据库</text>
<rect x="450" y="150" width="380" height="280" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="450" y="150" width="5" height="280" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="472" y="184" font-size="21" font-weight="600" fill="#17283f">Web Server</text>
<text x="472" y="220" font-size="18" font-weight="400" fill="#607088">管理登录、用户和设备</text>
<text x="472" y="248" font-size="18" font-weight="400" fill="#607088">写设备授权，采用deny-first</text>
<text x="472" y="276" font-size="18" font-weight="400" fill="#607088">只读成品清单及完整三件套</text>
<text x="472" y="304" font-size="18" font-weight="400" fill="#607088">GET / HEAD / Range每次鉴权</text>
<text x="472" y="332" font-size="18" font-weight="400" fill="#607088">不访问原件、中间态或job</text>
<text x="472" y="360" font-size="18" font-weight="400" fill="#607088">不生成字幕、MD或音频</text>
<rect x="860" y="150" width="380" height="280" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="860" y="150" width="5" height="280" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="882" y="184" font-size="21" font-weight="600" fill="#17283f">本机文件系统</text>
<text x="882" y="220" font-size="18" font-weight="400" fill="#607088">授权、来源与状态都是文件</text>
<text x="882" y="248" font-size="18" font-weight="400" fill="#607088">原件、中间和成品按目录划分</text>
<text x="882" y="276" font-size="18" font-weight="400" fill="#607088">路径受控，拒绝符号链接</text>
<text x="882" y="304" font-size="18" font-weight="400" fill="#607088">目录0700，文件0600</text>
<text x="882" y="332" font-size="18" font-weight="400" fill="#607088">临时文件校验后原子发布</text>
<text x="882" y="360" font-size="18" font-weight="400" fill="#607088">无双写、复制或备份任务</text>
<rect x="40" y="475" width="570" height="260" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="475" width="5" height="260" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="62" y="509" font-size="21" font-weight="600" fill="#17283f">完整性与资源</text>
<text x="62" y="545" font-size="18" font-weight="400" fill="#607088">原始音频不可信，解码子进程隔离</text>
<text x="62" y="573" font-size="18" font-weight="400" fill="#607088">模型离线加载，输入与输出有界</text>
<text x="62" y="601" font-size="18" font-weight="400" fill="#607088">按样本合并，不跳号或补静音</text>
<text x="62" y="629" font-size="18" font-weight="400" fill="#607088">三件套全部持久化后才发布</text>
<text x="62" y="657" font-size="18" font-weight="400" fill="#607088">大文件流式处理，空间不足暂停</text>
<rect x="650" y="475" width="590" height="260" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="650" y="475" width="5" height="260" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="672" y="509" font-size="21" font-weight="600" fill="#17283f">OP管理部署</text>
<text x="672" y="545" font-size="18" font-weight="400" fill="#607088">Nginx提供HTTPS，代理本机Web</text>
<text x="672" y="573" font-size="18" font-weight="400" fill="#607088">OP管理托管器、资源、监控和证书</text>
<text x="672" y="601" font-size="18" font-weight="400" fill="#607088">整体备份与恢复不由应用实现</text>
<text x="672" y="629" font-size="18" font-weight="400" fill="#607088">Clip故障不妨碍读取已有完整成品</text>
<text x="672" y="657" font-size="18" font-weight="400" fill="#607088">日志排除凭证和录音/识别正文</text>
<text x="45" y="820" font-size="23" font-weight="400" fill="#17283f">文件锁不代替fsync、原子发布或SQLite事务。</text>
<text x="45" y="868" font-size="20" font-weight="400" fill="#17283f">SQLite仅accounts / devices，由Web访问；录音、job和成品完全使用文件。</text>
</g>
</svg>
