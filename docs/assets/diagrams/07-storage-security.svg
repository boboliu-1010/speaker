<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1070" viewBox="0 0 1280 1070">
<title>录音文件由谁访问，Server 如何保护数据</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">录音文件由谁访问，Server 如何保护数据</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">浏览器不能直接访问存储目录；Server 核对用户归属和版本后，才读取或处理对应文件。</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="150" width="380" height="255" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="150" width="5" height="255" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="62" y="184" font-size="21" font-weight="600" fill="#17283f">浏览器 · 发起读取请求</text>
<text x="62" y="220" font-size="18" font-weight="400" fill="#607088">Cookie：携带本站会话身份</text>
<text x="62" y="248" font-size="18" font-weight="400" fill="#607088">录音 ID：指定要读取的录音</text>
<text x="62" y="276" font-size="18" font-weight="400" fill="#607088">revision：固定需要读取的音频版本</text>
<text x="62" y="304" font-size="18" font-weight="400" fill="#607088">通过 HTTPS 请求音频和文字</text>
<text x="62" y="332" font-size="18" font-weight="400" fill="#607088">退出时清理播放状态与本地会话状态</text>
<rect x="450" y="150" width="380" height="255" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="450" y="150" width="5" height="255" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="472" y="184" font-size="21" font-weight="600" fill="#17283f">Server · 核对会话与归属</text>
<text x="472" y="220" font-size="18" font-weight="400" fill="#607088">检查会话有效期和账号状态</text>
<text x="472" y="248" font-size="18" font-weight="400" fill="#607088">owner：录音所属的本站用户 ID</text>
<text x="472" y="276" font-size="18" font-weight="400" fill="#607088">仅允许读取当前用户拥有的录音</text>
<text x="472" y="304" font-size="18" font-weight="400" fill="#607088">跨用户查询统一返回 404</text>
<text x="472" y="332" font-size="18" font-weight="400" fill="#607088">每次媒体请求都重新鉴权</text>
<rect x="860" y="150" width="380" height="255" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="860" y="150" width="5" height="255" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="882" y="184" font-size="21" font-weight="600" fill="#17283f">Server · 校验文件并执行任务</text>
<text x="882" y="220" font-size="18" font-weight="400" fill="#607088">核对请求版本和文件发布状态</text>
<text x="882" y="248" font-size="18" font-weight="400" fill="#607088">以受控路径打开普通文件句柄</text>
<text x="882" y="276" font-size="18" font-weight="400" fill="#607088">拒绝符号链接和存储根之外的路径</text>
<text x="882" y="304" font-size="18" font-weight="400" fill="#607088">解码使用受限子进程并设置超时</text>
<text x="882" y="332" font-size="18" font-weight="400" fill="#607088">发布前核对大小、摘要和有效租约</text>
<rect x="40" y="450" width="380" height="360" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="450" width="5" height="360" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="62" y="484" font-size="21" font-weight="600" fill="#17283f">私有加密数据卷 · 保存业务数据</text>
<text x="62" y="520" font-size="18" font-weight="400" fill="#607088">raw：保留设备上传原件</text>
<text x="62" y="548" font-size="18" font-weight="400" fill="#607088">WAV：保存播放与识别用音频</text>
<text x="62" y="576" font-size="18" font-weight="400" fill="#607088">VTT：保存与原文对应的字幕</text>
<text x="62" y="604" font-size="18" font-weight="400" fill="#607088">SQLite：保存归属、版本及原文 JSON</text>
<text x="62" y="632" font-size="18" font-weight="400" fill="#607088">由专用服务账号访问存储内容</text>
<text x="62" y="660" font-size="18" font-weight="400" fill="#607088">目录权限 0700：仅服务账号可进入</text>
<text x="62" y="688" font-size="18" font-weight="400" fill="#607088">文件权限 0600：仅服务账号可读写</text>
<text x="62" y="716" font-size="18" font-weight="400" fill="#607088">文件位于 Web 静态资源目录之外</text>
<rect x="450" y="450" width="380" height="360" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="450" y="450" width="5" height="360" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="472" y="484" font-size="21" font-weight="600" fill="#17283f">受控 ASR · 处理音频并返回原文</text>
<text x="472" y="520" font-size="18" font-weight="400" fill="#607088">服务地址由 Server 配置</text>
<text x="472" y="548" font-size="18" font-weight="400" fill="#607088">远程连接使用 HTTPS 并校验证书</text>
<text x="472" y="576" font-size="18" font-weight="400" fill="#607088">本机端点须明确登记并限制访问</text>
<text x="472" y="604" font-size="18" font-weight="400" fill="#607088">禁止重定向，出站只放行配置目标</text>
<text x="472" y="632" font-size="18" font-weight="400" fill="#607088">输入 WAV 须先校验完整摘要</text>
<text x="472" y="660" font-size="18" font-weight="400" fill="#607088">返回原文、时间戳及说话人标识</text>
<text x="472" y="688" font-size="18" font-weight="400" fill="#607088">本地临时音频在处理结束后清理</text>
<text x="472" y="716" font-size="18" font-weight="400" fill="#607088">供应方留存按已核实的约定执行</text>
<rect x="860" y="450" width="380" height="360" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="860" y="450" width="5" height="360" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="882" y="484" font-size="21" font-weight="600" fill="#17283f">独立加密备份 · 恢复存储卷</text>
<text x="882" y="520" font-size="18" font-weight="400" fill="#607088">每日停写后复制一致性快照</text>
<text x="882" y="548" font-size="18" font-weight="400" fill="#607088">同时备份数据库、原件和当前产物</text>
<text x="882" y="576" font-size="18" font-weight="400" fill="#607088">清单记录每个文件的字节数与摘要</text>
<text x="882" y="604" font-size="18" font-weight="400" fill="#607088">校验成功后保留最近 7 份快照</text>
<text x="882" y="632" font-size="18" font-weight="400" fill="#607088">备份置于独立存储介质</text>
<text x="882" y="660" font-size="18" font-weight="400" fill="#607088">备份密钥与备份数据分开授权</text>
<text x="882" y="688" font-size="18" font-weight="400" fill="#607088">恢复时先校验清单和数据库完整性</text>
<text x="882" y="716" font-size="18" font-weight="400" fill="#607088">恢复后撤销旧凭证，重新确认访问</text>
<rect x="40" y="850" width="1200" height="175" rx="8" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="62" y="887" font-size="23" font-weight="600" fill="#17283f">访问、保存与恢复分别承担什么责任</text>
<text x="62" y="926" font-size="19" font-weight="400" fill="#17283f">访问控制：阻止其他用户读取录音。加密存储：保护离线数据卷与备份中的内容。</text>
<text x="62" y="961" font-size="19" font-weight="400" fill="#17283f">文件与数据库双写：保持产物和索引一致。独立备份：提供数据卷损坏后的恢复点。</text>
<text x="62" y="996" font-size="18" font-weight="400" fill="#607088">日志只保留定位信息和错误码，认证凭证与录音正文不写入日志。</text>
</g>
</svg>
