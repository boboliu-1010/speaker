<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790">
<title>录音文件与存储职责</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">录音文件与存储职责</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">设备原件、播放音频与识别文本的保存位置</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="56" y="169" font-size="20" font-weight="600" fill="#17283f">数据</text>
<text x="276" y="169" font-size="20" font-weight="600" fill="#17283f">保存位置</text>
<text x="596" y="169" font-size="20" font-weight="600" fill="#17283f">格式</text>
<text x="916" y="169" font-size="20" font-weight="600" fill="#17283f">用途</text>
<rect x="40" y="194" width="1200" height="70" rx="0" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="56" y="237" font-size="17" font-weight="400" fill="#17283f">设备原件</text>
<text x="276" y="237" font-size="17" font-weight="400" fill="#17283f">磁盘 raw；segments 索引</text>
<text x="596" y="237" font-size="17" font-weight="400" fill="#17283f">长度前缀 + Opus packet</text>
<text x="916" y="237" font-size="17" font-weight="400" fill="#17283f">归档 / 解码重试</text>
<rect x="40" y="264" width="1200" height="70" rx="0" fill="white" stroke="#d8e0ea"/>
<text x="56" y="307" font-size="17" font-weight="400" fill="#17283f">播放音频</text>
<text x="276" y="307" font-size="17" font-weight="400" fill="#17283f">磁盘 WAV；jobs 索引</text>
<text x="596" y="307" font-size="17" font-weight="400" fill="#17283f">16 kHz / mono / PCM16</text>
<text x="916" y="307" font-size="17" font-weight="400" fill="#17283f">播放 / ASR / 下载</text>
<rect x="40" y="334" width="1200" height="70" rx="0" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="56" y="377" font-size="17" font-weight="400" fill="#17283f">识别原文</text>
<text x="276" y="377" font-size="17" font-weight="400" fill="#17283f">recordings.transcript_json</text>
<text x="596" y="377" font-size="17" font-weight="400" fill="#17283f">UTF-8 JSON v1</text>
<text x="916" y="377" font-size="17" font-weight="400" fill="#17283f">阅读 / 复制 / 导出</text>
<rect x="40" y="404" width="1200" height="70" rx="0" fill="white" stroke="#d8e0ea"/>
<text x="56" y="447" font-size="17" font-weight="400" fill="#17283f">字幕文件</text>
<text x="276" y="447" font-size="17" font-weight="400" fill="#17283f">磁盘 VTT；jobs 索引</text>
<text x="596" y="447" font-size="17" font-weight="400" fill="#17283f">UTF-8 WEBVTT</text>
<text x="916" y="447" font-size="17" font-weight="400" fill="#17283f">字幕下载</text>
<rect x="40" y="474" width="1200" height="70" rx="0" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="56" y="517" font-size="17" font-weight="400" fill="#17283f">Markdown</text>
<text x="276" y="517" font-size="17" font-weight="400" fill="#17283f">下载时生成</text>
<text x="596" y="517" font-size="17" font-weight="400" fill="#17283f">日期标题 + speaker + 原文</text>
<text x="916" y="517" font-size="17" font-weight="400" fill="#17283f">文字下载</text>
<rect x="40" y="590" width="580" height="139" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="590" width="5" height="139" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="62" y="624" font-size="21" font-weight="600" fill="#17283f">raw 解包与 WAV 校验</text>
<text x="62" y="660" font-size="18" font-weight="400" fill="#607088">uint16 little-endian 包长度；按冻结片段顺序解码</text>
<text x="62" y="688" font-size="18" font-weight="400" fill="#607088">记录样本数、时长、字节数与独立 SHA-256</text>
<rect x="650" y="590" width="590" height="139" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="650" y="590" width="5" height="139" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="672" y="624" font-size="21" font-weight="600" fill="#17283f">处理容量</text>
<text x="672" y="660" font-size="18" font-weight="400" fill="#607088">单个 raw 段上限 8 MiB；连续处理上限 8 小时</text>
<text x="672" y="688" font-size="18" font-weight="400" fill="#607088">临时分段文件在发布完成后清理</text>
</g>
</svg>
