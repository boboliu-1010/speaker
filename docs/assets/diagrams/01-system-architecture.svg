<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1395" viewBox="0 0 1280 1395">
<title>系统架构</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">系统架构</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">原件就绪后导入业务库，由 Server 完成解码、识别、播放和导出。</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="150" width="280" height="210" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="150" width="5" height="210" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="62" y="184" font-size="21" font-weight="600" fill="#17283f">浏览器 Web</text>
<text x="62" y="220" font-size="18" font-weight="400" fill="#607088">发起登录并查看本人录音</text>
<text x="62" y="248" font-size="18" font-weight="400" fill="#607088">HTTPS 9529：请求业务数据</text>
<text x="62" y="276" font-size="18" font-weight="400" fill="#607088">通过 BLE 把配置写入 Clip</text>
<text x="62" y="304" font-size="18" font-weight="400" fill="#607088">按片段播放音频并下载字幕</text>
<rect x="347" y="150" width="280" height="210" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="347" y="150" width="5" height="210" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="369" y="184" font-size="21" font-weight="600" fill="#17283f">已就绪原件来源</text>
<text x="369" y="220" font-size="18" font-weight="400" fill="#607088">由接入组件提供</text>
<text x="369" y="248" font-size="18" font-weight="400" fill="#607088">raw 原件交付后复制到两盘</text>
<text x="369" y="276" font-size="18" font-weight="400" fill="#607088">来源包含归属、会话与段号</text>
<text x="369" y="304" font-size="18" font-weight="400" fill="#607088">提供可信来源元数据</text>
<rect x="654" y="150" width="280" height="210" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="654" y="150" width="5" height="210" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="676" y="184" font-size="21" font-weight="600" fill="#17283f">Google 身份服务</text>
<text x="676" y="220" font-size="18" font-weight="400" fill="#607088">通过 OIDC 验证 Google 身份</text>
<text x="676" y="248" font-size="18" font-weight="400" fill="#607088">把授权结果回调给 Server</text>
<text x="676" y="276" font-size="18" font-weight="400" fill="#607088">Server 随后创建本站会话</text>
<rect x="961" y="150" width="279" height="210" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="961" y="150" width="5" height="210" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="983" y="184" font-size="21" font-weight="600" fill="#17283f">受控 ASR 服务</text>
<text x="983" y="220" font-size="18" font-weight="400" fill="#607088">每次识别一份片段 WAV</text>
<text x="983" y="248" font-size="18" font-weight="400" fill="#607088">返回识别原文和时间戳</text>
<text x="983" y="276" font-size="18" font-weight="400" fill="#607088">speaker 表示匿名说话人</text>
<text x="983" y="304" font-size="18" font-weight="400" fill="#607088">服务地址由 Server 配置</text>
<rect x="40" y="405" width="1200" height="650" rx="8" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="62" y="445" font-size="25" font-weight="600" fill="#17283f">Server · Python FastAPI 单进程</text>
<text x="62" y="476" font-size="17" font-weight="400" fill="#607088">HTTP：用户、会话、设备、录音、播放与导出；原件导入读取 ready 来源。</text>
<rect x="60" y="502" width="360" height="195" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="60" y="502" width="5" height="195" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="82" y="536" font-size="21" font-weight="600" fill="#17283f">用户与会话</text>
<text x="82" y="572" font-size="18" font-weight="400" fill="#607088">Google 登录并建立本站会话</text>
<text x="82" y="600" font-size="18" font-weight="400" fill="#607088">users/me：读取本人资料</text>
<text x="82" y="628" font-size="18" font-weight="400" fill="#607088">仅允许修改本人的显示名称</text>
<text x="82" y="656" font-size="18" font-weight="400" fill="#607088">CSRF：校验写请求的防伪标记</text>
<text x="82" y="684" font-size="18" font-weight="400" fill="#607088">会话和登录临时状态只保存在内存</text>
<rect x="460" y="502" width="360" height="195" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="460" y="502" width="5" height="195" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="482" y="536" font-size="21" font-weight="600" fill="#17283f">设备与绑定</text>
<text x="482" y="572" font-size="18" font-weight="400" fill="#607088">验证设备登记与用户归属</text>
<text x="482" y="600" font-size="18" font-weight="400" fill="#607088">发放设备上传配置</text>
<text x="482" y="628" font-size="18" font-weight="400" fill="#607088">记录 BLE 写入后的读回确认</text>
<text x="482" y="656" font-size="18" font-weight="400" fill="#607088">移除设备时撤销上传凭证</text>
<rect x="860" y="502" width="360" height="195" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="860" y="502" width="5" height="195" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="882" y="536" font-size="21" font-weight="600" fill="#17283f">已就绪原件校验</text>
<text x="882" y="572" font-size="18" font-weight="400" fill="#607088">读取 registry.sources 的 ready 来源</text>
<text x="882" y="600" font-size="18" font-weight="400" fill="#607088">owner 与身份来自可信来源记录</text>
<text x="882" y="628" font-size="18" font-weight="400" fill="#607088">校验原件存在、实际大小与 hash</text>
<text x="882" y="656" font-size="18" font-weight="400" fill="#607088">两盘原件与描述保存后才导入</text>
<rect x="60" y="710" width="360" height="185" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="60" y="710" width="5" height="185" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="82" y="744" font-size="21" font-weight="600" fill="#17283f">原件导入与录音聚合</text>
<text x="82" y="780" font-size="18" font-weight="400" fill="#607088">把来源记录导入业务 SQLite</text>
<text x="82" y="808" font-size="18" font-weight="400" fill="#607088">按绑定与录音会话归并片段</text>
<text x="82" y="836" font-size="18" font-weight="400" fill="#607088">用来源唯一键避免重复导入</text>
<text x="82" y="864" font-size="18" font-weight="400" fill="#607088">可见内容变化递增 content_revision</text>
<rect x="460" y="710" width="360" height="185" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="460" y="710" width="5" height="185" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="482" y="744" font-size="21" font-weight="600" fill="#17283f">录音查询与媒体读取</text>
<text x="482" y="780" font-size="18" font-weight="400" fill="#607088">只查询当前用户拥有的录音</text>
<text x="482" y="808" font-size="18" font-weight="400" fill="#607088">核对版本后打开已发布文件</text>
<text x="482" y="836" font-size="18" font-weight="400" fill="#607088">Range：读取指定音频字节区间</text>
<text x="482" y="864" font-size="18" font-weight="400" fill="#607088">从同快照生成 VTT 与 Markdown</text>
<rect x="860" y="710" width="360" height="185" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="860" y="710" width="5" height="185" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="882" y="744" font-size="21" font-weight="600" fill="#17283f">后台任务与恢复</text>
<text x="882" y="780" font-size="18" font-weight="400" fill="#607088">一个工作者持独占锁，顺序处理</text>
<text x="882" y="808" font-size="18" font-weight="400" fill="#607088">成功片段保留，失败片段单独重试</text>
<text x="882" y="836" font-size="18" font-weight="400" fill="#607088">有版本差时重建录音结果快照</text>
<text x="882" y="864" font-size="18" font-weight="400" fill="#607088">保留执行次数，重启恢复未完成片段</text>
<rect x="60" y="923" width="1160" height="101" rx="8" fill="white" stroke="#d8e0ea"/>
<text x="82" y="958" font-size="21" font-weight="600" fill="#087f74">受控解码子进程</text>
<text x="82" y="994" font-size="18" font-weight="400" fill="#17283f">设备每 5 分钟生成一段原件，每段解码为一个 WAV 并独立识别；Server 不再二次切块。</text>
<rect x="40" y="1095" width="380" height="255" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="1095" width="5" height="255" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="62" y="1129" font-size="21" font-weight="600" fill="#17283f">业务 SQLite · 保存录音业务数据</text>
<text x="62" y="1165" font-size="18" font-weight="400" fill="#607088">accounts：保存本站用户身份</text>
<text x="62" y="1193" font-size="18" font-weight="400" fill="#607088">recordings：内容/结果版本与 JSON 快照</text>
<text x="62" y="1221" font-size="18" font-weight="400" fill="#607088">recording_segments：片段与识别结果</text>
<text x="62" y="1249" font-size="18" font-weight="400" fill="#607088">数据库存储独立于两块录音数据盘</text>
<rect x="450" y="1095" width="380" height="255" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="450" y="1095" width="5" height="255" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="472" y="1129" font-size="21" font-weight="600" fill="#17283f">设备与上传 SQLite · registry</text>
<text x="472" y="1165" font-size="18" font-weight="400" fill="#607088">bindings：保存设备归属与凭证</text>
<text x="472" y="1193" font-size="18" font-weight="400" fill="#607088">device_uids：映射硬件 UID 与设备</text>
<text x="472" y="1221" font-size="18" font-weight="400" fill="#607088">binding_profiles：保存上传配置版本</text>
<text x="472" y="1249" font-size="18" font-weight="400" fill="#607088">sources：记录每份原件及导入进度</text>
<rect x="860" y="1095" width="380" height="255" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="860" y="1095" width="5" height="255" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="882" y="1129" font-size="21" font-weight="600" fill="#17283f">双盘文件存储</text>
<text x="882" y="1165" font-size="18" font-weight="400" fill="#607088">SPEAKER_PRIMARY_ROOT：主盘</text>
<text x="882" y="1193" font-size="18" font-weight="400" fill="#607088">SPEAKER_REPLICA_ROOT：副本盘</text>
<text x="882" y="1221" font-size="18" font-weight="400" fill="#607088">SPEAKER_BACKUP_ROOT：版本备份</text>
<text x="882" y="1249" font-size="18" font-weight="400" fill="#607088">双盘仅存文件，数据库独立存放</text>
</g>
</svg>
