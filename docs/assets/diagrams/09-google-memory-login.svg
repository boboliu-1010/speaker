<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790">
<title>Google 登录的数据边界</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">Google 登录的数据边界</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">认证协议使用 OAuth 2.0 / OIDC + S256 PKCE</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="165" width="370" height="349" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="165" width="5" height="349" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="62" y="199" font-size="21" font-weight="600" fill="#17283f">浏览器</text>
<text x="62" y="235" font-size="18" font-weight="400" fill="#607088">__Host-boa_oauth</text>
<text x="62" y="263" font-size="18" font-weight="400" fill="#607088">临时绑定 Cookie，SameSite=Lax</text>
<text x="62" y="291" font-size="18" font-weight="400" fill="#607088">__Host-boa_session</text>
<text x="62" y="319" font-size="18" font-weight="400" fill="#607088">会话 Cookie，Secure / HttpOnly</text>
<text x="62" y="347" font-size="18" font-weight="400" fill="#607088">页面内存保存 CSRF token</text>
<rect x="455" y="165" width="370" height="349" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="455" y="165" width="5" height="349" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="477" y="199" font-size="21" font-weight="600" fill="#17283f">Server 内存</text>
<text x="477" y="235" font-size="18" font-weight="400" fill="#607088">LoginFlow：state / nonce / PKCE</text>
<text x="477" y="263" font-size="18" font-weight="400" fill="#607088">一次消费，5 分钟过期</text>
<text x="477" y="291" font-size="18" font-weight="400" fill="#607088">Session：user_id / auth_version</text>
<text x="477" y="319" font-size="18" font-weight="400" fill="#607088">闲置 24 小时，最长 7 天</text>
<text x="477" y="347" font-size="18" font-weight="400" fill="#607088">验证 Google 签名、公钥与 audience</text>
<rect x="870" y="165" width="370" height="349" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="870" y="165" width="5" height="349" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="892" y="199" font-size="21" font-weight="600" fill="#17283f">SQLite / registry</text>
<text x="892" y="235" font-size="18" font-weight="400" fill="#607088">accounts：稳定 user_id 与 sub</text>
<text x="892" y="263" font-size="18" font-weight="400" fill="#607088">设备绑定与上传凭证</text>
<text x="892" y="291" font-size="18" font-weight="400" fill="#607088">录音原件与识别文字</text>
<text x="892" y="319" font-size="18" font-weight="400" fill="#607088">后台任务与来源投影</text>
<text x="892" y="347" font-size="18" font-weight="400" fill="#607088">每次请求检查用户状态和 owner</text>
<rect x="40" y="555" width="1200" height="163" rx="8" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="63" y="592" font-size="23" font-weight="600" fill="#17283f">生命周期</text>
<text x="63" y="636" font-size="20" font-weight="500" fill="#087f74">登录完成</text>
<text x="63" y="673" font-size="19" font-weight="400" fill="#17283f">创建新的本站会话</text>
<text x="460" y="636" font-size="20" font-weight="500" fill="#087f74">退出 / 到期</text>
<text x="460" y="673" font-size="19" font-weight="400" fill="#17283f">清除当前会话</text>
<text x="859" y="636" font-size="20" font-weight="500" fill="#087f74">Server 重启</text>
<text x="859" y="673" font-size="19" font-weight="400" fill="#17283f">网页登录重新认证</text>
<text x="40" y="759" font-size="18" font-weight="400" fill="#607088">用户、设备、录音与后台任务持续保存在持久存储中。</text>
</g>
</svg>
