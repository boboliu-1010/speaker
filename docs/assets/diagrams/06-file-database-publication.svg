<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1385" viewBox="0 0 1280 1385">
<title>文件何时落盘，处理结果何时可读取</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">文件何时落盘，处理结果何时可读取</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">示例为 WAV 已发布、文字尚待识别；这里只展开发布涉及字段，完整任务对象见正文。</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="150" width="760" height="755" rx="8" fill="white" stroke="#d8e0ea"/>
<text x="62" y="189" font-size="23" font-weight="600" fill="#17283f">jobs · 保存本次文件处理与发布状态</text>
<text x="64" y="232" font-size="18" font-weight="400" fill="#17283f">{</text>
<text x="80" y="261" font-size="15" font-weight="400" fill="#607088">// 任务执行状态；succeeded 表示任务已成功结束</text>
<text x="80" y="281" font-size="16" font-weight="400" fill="#17283f">&quot;state&quot;: &quot;succeeded&quot;,</text>
<text x="80" y="327" font-size="15" font-weight="400" fill="#607088">// 文件发布状态；ready 表示文件已落盘且结果事务已提交</text>
<text x="80" y="347" font-size="16" font-weight="400" fill="#17283f">&quot;publication_state&quot;: &quot;ready&quot;,</text>
<text x="80" y="393" font-size="15" font-weight="400" fill="#607088">// 执行者随机标识；执行中提交结果时必须与当前值一致</text>
<text x="80" y="413" font-size="16" font-weight="400" fill="#17283f">&quot;lease_token&quot;: null,</text>
<text x="80" y="459" font-size="15" font-weight="400" fill="#607088">// 执行租约到期时间，Unix 毫秒；到期的执行者不能提交</text>
<text x="80" y="479" font-size="16" font-weight="400" fill="#17283f">&quot;lease_until&quot;: null,</text>
<text x="80" y="525" font-size="15" font-weight="400" fill="#607088">// 临时文件相对路径；prepared 时必须填写</text>
<text x="80" y="545" font-size="16" font-weight="400" fill="#17283f">&quot;tmp_relative_path&quot;: null,</text>
<text x="80" y="591" font-size="15" font-weight="400" fill="#607088">// 最终文件相对路径；每次发布生成新路径，禁止覆盖旧文件</text>
<text x="80" y="611" font-size="16" font-weight="400" fill="#17283f">&quot;final_relative_path&quot;: &quot;derived/job-001/pub-001.wav&quot;,</text>
<text x="80" y="657" font-size="15" font-weight="400" fill="#607088">// 文件字节数；校验文件是否完整并生成下载长度</text>
<text x="80" y="677" font-size="16" font-weight="400" fill="#17283f">&quot;size_bytes&quot;: 185644,</text>
<text x="80" y="723" font-size="15" font-weight="400" fill="#607088">// 文件完整 SHA-256；用于发布核验、文件修复和 ETag</text>
<text x="80" y="743" font-size="16" font-weight="400" fill="#17283f">&quot;sha256&quot;: &quot;bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb&quot;,</text>
<text x="80" y="789" font-size="15" font-weight="400" fill="#607088">// WAV 的 PCM 样本数；用于计算时长，VTT 此值为 null</text>
<text x="80" y="809" font-size="16" font-weight="400" fill="#17283f">&quot;sample_count&quot;: 92800</text>
<text x="64" y="855" font-size="18" font-weight="400" fill="#17283f">}</text>
<rect x="840" y="150" width="400" height="535" rx="8" fill="white" stroke="#d8e0ea"/>
<text x="862" y="189" font-size="23" font-weight="600" fill="#17283f">recordings · 保存当前结果</text>
<text x="864" y="232" font-size="18" font-weight="400" fill="#17283f">{</text>
<text x="880" y="261" font-size="15" font-weight="400" fill="#607088">// 当前 WAV 对应的 decode 任务 ID</text>
<text x="880" y="281" font-size="16" font-weight="400" fill="#17283f">&quot;wav_job_id&quot;: &quot;job-001&quot;,</text>
<text x="880" y="315" font-size="15" font-weight="400" fill="#607088">// 当前 WAV 对应的输入版本</text>
<text x="880" y="335" font-size="16" font-weight="400" fill="#17283f">&quot;audio_revision&quot;: 1,</text>
<text x="880" y="369" font-size="15" font-weight="400" fill="#607088">// 当前 WAV 时长，单位为毫秒</text>
<text x="880" y="389" font-size="16" font-weight="400" fill="#17283f">&quot;duration_ms&quot;: 5800,</text>
<text x="880" y="423" font-size="15" font-weight="400" fill="#607088">// 当前字幕任务 ID；尚未发布时为空</text>
<text x="880" y="443" font-size="16" font-weight="400" fill="#17283f">&quot;vtt_job_id&quot;: null,</text>
<text x="880" y="477" font-size="15" font-weight="400" fill="#607088">// 文字版本；ready 时须等于音频版本</text>
<text x="880" y="497" font-size="16" font-weight="400" fill="#17283f">&quot;transcript_revision&quot;: null,</text>
<text x="880" y="531" font-size="15" font-weight="400" fill="#607088">// 文字处理进度；此例为等待识别</text>
<text x="880" y="551" font-size="16" font-weight="400" fill="#17283f">&quot;transcript_state&quot;: &quot;pending&quot;,</text>
<text x="880" y="585" font-size="15" font-weight="400" fill="#607088">// 识别原文和时间戳；完成后存入 JSON</text>
<text x="880" y="605" font-size="16" font-weight="400" fill="#17283f">&quot;transcript_json&quot;: null</text>
<text x="864" y="639" font-size="18" font-weight="400" fill="#17283f">}</text>
<rect x="840" y="715" width="400" height="190" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="840" y="715" width="5" height="190" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="862" y="749" font-size="21" font-weight="600" fill="#17283f">转写完成时必须一起提交</text>
<text x="862" y="785" font-size="18" font-weight="400" fill="#607088">transcript_json 保存识别原文</text>
<text x="862" y="813" font-size="18" font-weight="400" fill="#607088">vtt_job_id 指向已落盘字幕文件</text>
<text x="862" y="841" font-size="18" font-weight="400" fill="#607088">transcript_revision 写入对应音频版本</text>
<text x="862" y="869" font-size="18" font-weight="400" fill="#607088">transcript_state 改为 ready</text>
<rect x="40" y="945" width="280" height="212" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="945" width="5" height="212" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="62" y="979" font-size="21" font-weight="600" fill="#17283f">1 · 准备发布</text>
<text x="62" y="1015" font-size="18" font-weight="400" fill="#607088">保存固定输入快照</text>
<text x="62" y="1043" font-size="18" font-weight="400" fill="#607088">记录当前执行租约</text>
<text x="62" y="1071" font-size="18" font-weight="400" fill="#607088">记录临时与最终路径</text>
<text x="62" y="1099" font-size="18" font-weight="400" fill="#607088">文件状态改为 prepared</text>
<rect x="347" y="945" width="280" height="212" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="347" y="945" width="5" height="212" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="369" y="979" font-size="21" font-weight="600" fill="#17283f">2 · 生成临时文件</text>
<text x="369" y="1015" font-size="18" font-weight="400" fill="#607088">生成 WAV 或 VTT</text>
<text x="369" y="1043" font-size="18" font-weight="400" fill="#607088">fsync 使文件内容持久化</text>
<text x="369" y="1071" font-size="18" font-weight="400" fill="#607088">分别保存字节数与摘要</text>
<text x="369" y="1099" font-size="18" font-weight="400" fill="#607088">WAV 另外记录样本数</text>
<rect x="654" y="945" width="280" height="212" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="654" y="945" width="5" height="212" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="676" y="979" font-size="21" font-weight="600" fill="#17283f">3 · 创建最终文件</text>
<text x="676" y="1015" font-size="18" font-weight="400" fill="#607088">link 原子创建最终路径</text>
<text x="676" y="1043" font-size="18" font-weight="400" fill="#607088">已有目标文件时禁止覆盖</text>
<text x="676" y="1071" font-size="18" font-weight="400" fill="#607088">fsync 目录持久化文件名</text>
<text x="676" y="1099" font-size="18" font-weight="400" fill="#607088">结果事务提交前仍不可读</text>
<rect x="961" y="945" width="279" height="212" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="961" y="945" width="5" height="212" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="983" y="979" font-size="21" font-weight="600" fill="#17283f">4 · 提交可读结果</text>
<text x="983" y="1015" font-size="18" font-weight="400" fill="#607088">校验归属、版本和有效租约</text>
<text x="983" y="1043" font-size="18" font-weight="400" fill="#607088">同一事务更新任务与录音</text>
<text x="983" y="1071" font-size="18" font-weight="400" fill="#607088">成功后才切换当前结果</text>
<text x="983" y="1099" font-size="18" font-weight="400" fill="#607088">最后清理临时文件</text>
<rect x="40" y="1197" width="585" height="146" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="1197" width="5" height="146" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="62" y="1231" font-size="21" font-weight="600" fill="#17283f">VTT 已落盘，识别原文尚未提交</text>
<text x="62" y="1267" font-size="18" font-weight="400" fill="#607088">放弃本次未提交产物，按重试规则重新识别。</text>
<text x="62" y="1295" font-size="18" font-weight="400" fill="#607088">新的原文和字幕文件一起发布，保留之前已提交结果。</text>
<rect x="655" y="1197" width="585" height="146" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="655" y="1197" width="5" height="146" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="677" y="1231" font-size="21" font-weight="600" fill="#17283f">识别原文已提交，VTT 丢失或损坏</text>
<text x="677" y="1267" font-size="18" font-weight="400" fill="#607088">从同版本 JSON 重建 VTT，无须重新调用 ASR。</text>
<text x="677" y="1295" font-size="18" font-weight="400" fill="#607088">修复时核对预期摘要、当前指针和有效租约。</text>
</g>
</svg>
