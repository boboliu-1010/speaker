<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="805" viewBox="0 0 1280 805">
<title>文件与数据库双写</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">文件与数据库双写</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">文件落盘后，jobs / 录音指针 / 转写 JSON 按事务发布</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="52" y="165" font-size="19" font-weight="600" fill="#17283f">提交阶段</text>
<text x="217" y="165" font-size="19" font-weight="600" fill="#17283f">磁盘文件</text>
<text x="502" y="165" font-size="19" font-weight="600" fill="#17283f">jobs</text>
<text x="772" y="165" font-size="19" font-weight="600" fill="#17283f">recordings</text>
<text x="1022" y="165" font-size="19" font-weight="600" fill="#17283f">恢复动作</text>
<rect x="40" y="194" width="1200" height="100" rx="0" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="52" y="230" font-size="16" font-weight="400" fill="#17283f">准备</text>
<text x="217" y="230" font-size="16" font-weight="400" fill="#17283f">临时路径 / 最终路径</text>
<text x="502" y="230" font-size="16" font-weight="400" fill="#17283f">prepared</text>
<text x="502" y="256" font-size="16" font-weight="400" fill="#17283f">记录 lease</text>
<text x="772" y="230" font-size="16" font-weight="400" fill="#17283f">保留当前指针</text>
<text x="1022" y="230" font-size="16" font-weight="400" fill="#17283f">回收过期 lease</text>
<rect x="40" y="294" width="1200" height="100" rx="0" fill="white" stroke="#d8e0ea"/>
<text x="52" y="330" font-size="16" font-weight="400" fill="#17283f">生成</text>
<text x="217" y="330" font-size="16" font-weight="400" fill="#17283f">临时文件 fsync</text>
<text x="217" y="356" font-size="16" font-weight="400" fill="#17283f">记录 size/hash/sample_count</text>
<text x="502" y="330" font-size="16" font-weight="400" fill="#17283f">prepared</text>
<text x="502" y="356" font-size="16" font-weight="400" fill="#17283f">元数据已保存</text>
<text x="772" y="330" font-size="16" font-weight="400" fill="#17283f">保留当前指针</text>
<text x="1022" y="330" font-size="16" font-weight="400" fill="#17283f">重做未完成产物</text>
<rect x="40" y="394" width="1200" height="100" rx="0" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="52" y="430" font-size="16" font-weight="400" fill="#17283f">文件落盘</text>
<text x="217" y="430" font-size="16" font-weight="400" fill="#17283f">rename + 目录 fsync</text>
<text x="502" y="430" font-size="16" font-weight="400" fill="#17283f">prepared</text>
<text x="502" y="456" font-size="16" font-weight="400" fill="#17283f">最终文件可校验</text>
<text x="772" y="430" font-size="16" font-weight="400" fill="#17283f">等待事务提交</text>
<text x="1022" y="430" font-size="16" font-weight="400" fill="#17283f">WAV 校验后补提交</text>
<text x="1022" y="456" font-size="16" font-weight="400" fill="#17283f">VTT 结合文字事务处理</text>
<rect x="40" y="494" width="1200" height="100" rx="0" fill="white" stroke="#d8e0ea"/>
<text x="52" y="530" font-size="16" font-weight="400" fill="#17283f">事务完成</text>
<text x="217" y="530" font-size="16" font-weight="400" fill="#17283f">最终 WAV / VTT</text>
<text x="502" y="530" font-size="16" font-weight="400" fill="#17283f">succeeded / ready</text>
<text x="772" y="530" font-size="16" font-weight="400" fill="#17283f">更新版本与指针</text>
<text x="772" y="556" font-size="16" font-weight="400" fill="#17283f">转写同时写 JSON</text>
<text x="1022" y="530" font-size="16" font-weight="400" fill="#17283f">直接读取已存结果</text>
<rect x="40" y="636" width="1200" height="103" rx="8" fill="#edf5f2" stroke="#c8dfd8"/>
<text x="60" y="671" font-size="22" font-weight="600" fill="#087f74">转写恢复规则</text>
<text x="60" y="709" font-size="18" font-weight="400" fill="#17283f">VTT 已落盘、JSON 未提交：重跑 ASR 后整体发布。JSON 已提交、VTT 丢失：从 JSON 重建 VTT。</text>
</g>
</svg>
