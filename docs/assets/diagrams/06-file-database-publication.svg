<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100">
<title>先保存每块结果，再发布整条录音的汇总</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">先保存每块结果，再发布整条录音的汇总</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">没有独立 jobs 表；recording_segments 保存块结果，recordings 保存播放清单、JSON 与 VTT。</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="150" width="585" height="250" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="150" width="5" height="250" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="62" y="184" font-size="21" font-weight="600" fill="#17283f">recording_segments · 原件与分块</text>
<text x="62" y="220" font-size="18" font-weight="400" fill="#607088">raw：保留原件路径、大小与 hash</text>
<text x="62" y="248" font-size="18" font-weight="400" fill="#607088">chunks_json：每块核心 WAV、文字及状态</text>
<text x="62" y="276" font-size="18" font-weight="400" fill="#607088">每块保存重试次数和下次执行时间</text>
<text x="62" y="304" font-size="18" font-weight="400" fill="#607088">generation + 租约：防止旧执行者覆盖结果</text>
<text x="62" y="332" font-size="18" font-weight="400" fill="#607088">成功块提交后，标记录音 merge_dirty</text>
<rect x="655" y="150" width="585" height="250" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="655" y="150" width="5" height="250" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="677" y="184" font-size="21" font-weight="600" fill="#17283f">recordings · 当前已发布汇总</text>
<text x="677" y="220" font-size="18" font-weight="400" fill="#607088">audio_manifest_json：有序核心音频清单</text>
<text x="677" y="248" font-size="18" font-weight="400" fill="#607088">transcript_json：全局时间戳与覆盖缺口</text>
<text x="677" y="276" font-size="18" font-weight="400" fill="#607088">vtt_file_json：当前字幕路径、大小与 hash</text>
<text x="677" y="304" font-size="18" font-weight="400" fill="#607088">result_revision：音频清单和文字的共同版本</text>
<text x="677" y="332" font-size="18" font-weight="400" fill="#607088">pending_publication_json：可恢复的发布候选</text>
<rect x="40" y="440" width="280" height="240" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="440" width="5" height="240" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="62" y="474" font-size="21" font-weight="600" fill="#17283f">1 · 解码核心块</text>
<text x="62" y="510" font-size="18" font-weight="400" fill="#607088">独立流式解码一份原件</text>
<text x="62" y="538" font-size="18" font-weight="400" fill="#607088">只生成无重叠核心 WAV</text>
<text x="62" y="566" font-size="18" font-weight="400" fill="#607088">文件先 fsync，再提交块索引</text>
<text x="62" y="594" font-size="18" font-weight="400" fill="#607088">扫描完成后确认总样本数</text>
<rect x="347" y="440" width="280" height="240" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="347" y="440" width="5" height="240" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="369" y="474" font-size="21" font-weight="600" fill="#17283f">2 · 单块识别</text>
<text x="369" y="510" font-size="18" font-weight="400" fill="#607088">原件内前后各加至多 1 秒</text>
<text x="369" y="538" font-size="18" font-weight="400" fill="#607088">每次识别一个短块</text>
<text x="369" y="566" font-size="18" font-weight="400" fill="#607088">成功原文立即入库</text>
<text x="369" y="594" font-size="18" font-weight="400" fill="#607088">失败只重试当前块</text>
<rect x="654" y="440" width="280" height="240" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="654" y="440" width="5" height="240" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="676" y="474" font-size="21" font-weight="600" fill="#17283f">3 · 汇总字幕</text>
<text x="676" y="510" font-size="18" font-weight="400" fill="#607088">按连续原件样本数计算偏移</text>
<text x="676" y="538" font-size="18" font-weight="400" fill="#607088">缺号后的识别结果先缓存</text>
<text x="676" y="566" font-size="18" font-weight="400" fill="#607088">失败块保留真实时长与缺口</text>
<text x="676" y="594" font-size="18" font-weight="400" fill="#607088">不调用 ASR，只合并已有结果</text>
<rect x="961" y="440" width="279" height="240" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="961" y="440" width="5" height="240" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="983" y="474" font-size="21" font-weight="600" fill="#17283f">4 · 发布结果</text>
<text x="983" y="510" font-size="18" font-weight="400" fill="#607088">记录候选与新字幕路径</text>
<text x="983" y="538" font-size="18" font-weight="400" fill="#607088">字幕落盘，校验大小和摘要</text>
<text x="983" y="566" font-size="18" font-weight="400" fill="#607088">CAS 提交清单、JSON 与版本</text>
<text x="983" y="594" font-size="18" font-weight="400" fill="#607088">保留正在下载的旧文件</text>
<rect x="40" y="720" width="585" height="150" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="720" width="5" height="150" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="62" y="754" font-size="21" font-weight="600" fill="#17283f">块已识别，汇总或 VTT 发布中断</text>
<text x="62" y="790" font-size="18" font-weight="400" fill="#607088">直接复用 chunks_json 中的成功原文。</text>
<text x="62" y="818" font-size="18" font-weight="400" fill="#607088">恢复候选发布或重新合并，不重新调用 ASR。</text>
<rect x="655" y="720" width="585" height="150" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="655" y="720" width="5" height="150" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="677" y="754" font-size="21" font-weight="600" fill="#17283f">已提交 VTT 丢失，或核心 WAV 丢失</text>
<text x="677" y="790" font-size="18" font-weight="400" fill="#607088">字幕从同版本 JSON 重建；音频从原件重建目标块。</text>
<text x="677" y="818" font-size="18" font-weight="400" fill="#607088">核验原摘要，保留文字结果与旧文件引用。</text>
<rect x="40" y="910" width="1200" height="135" rx="8" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="62" y="947" font-size="23" font-weight="600" fill="#17283f">时间轴与部分结果</text>
<text x="62" y="986" font-size="19" font-weight="400" fill="#17283f">缺少原件时不猜全局偏移；识别失败的块占时保留；partial 与 coverage 明确展示缺口。</text>
<text x="62" y="1020" font-size="18" font-weight="400" fill="#607088">局部 speaker 不等于跨块同一人；默认播放器逐块切换，不承诺无缝播放。</text>
</g>
</svg>
