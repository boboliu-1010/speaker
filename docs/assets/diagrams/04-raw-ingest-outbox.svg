<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<title>收件与数据投影</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">收件与数据投影</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">原件持久化与业务索引分别承担确认和读取职责</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="160" width="250" height="370" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="160" width="5" height="370" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="62" y="194" font-size="21" font-weight="600" fill="#17283f">设备 / 接收器</text>
<text x="62" y="230" font-size="18" font-weight="400" fill="#607088">设备凭证与归属校验</text>
<text x="62" y="258" font-size="18" font-weight="400" fill="#607088">已持久偏移 ACK</text>
<text x="62" y="286" font-size="18" font-weight="400" fill="#607088">size / SHA-256 检查</text>
<text x="62" y="314" font-size="18" font-weight="400" fill="#607088">raw 与 identity 持久化</text>
<text x="62" y="342" font-size="18" font-weight="400" fill="#607088">完整来源就绪后 COMPLETE</text>
<rect x="335" y="160" width="415" height="213" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="335" y="160" width="415" height="48" rx="0" fill="#17283f" stroke="#17283f"/>
<text x="353" y="192" font-size="21" font-weight="600" fill="white">registry.sources</text>
<rect x="336" y="208" width="413" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="351" y="230" font-size="16" font-weight="400" fill="#17283f">source_id / owner / binding</text>
<text x="351" y="261" font-size="16" font-weight="400" fill="#17283f">session / segment / object_id</text>
<rect x="336" y="270" width="413" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="351" y="292" font-size="16" font-weight="400" fill="#17283f">size / sha256</text>
<text x="351" y="323" font-size="16" font-weight="400" fill="#17283f">state = ready</text>
<rect x="336" y="332" width="413" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="351" y="354" font-size="16" font-weight="400" fill="#17283f">projected_at = NULL 或提交时间</text>
<rect x="795" y="160" width="445" height="213" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="795" y="160" width="445" height="48" rx="0" fill="#17283f" stroke="#17283f"/>
<text x="813" y="192" font-size="21" font-weight="600" fill="white">业务库</text>
<rect x="796" y="208" width="443" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="811" y="230" font-size="16" font-weight="400" fill="#17283f">recordings：来源聚合与输入版本</text>
<text x="811" y="261" font-size="16" font-weight="400" fill="#17283f">recording_segments：raw 元数据</text>
<rect x="796" y="270" width="443" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="811" y="292" font-size="16" font-weight="400" fill="#17283f">唯一键：namespace + source_id</text>
<text x="811" y="323" font-size="16" font-weight="400" fill="#17283f">imported_at：首次导入时间</text>
<rect x="796" y="332" width="443" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="811" y="354" font-size="16" font-weight="400" fill="#17283f">同一事务更新片段与录音版本</text>
<rect x="335" y="430" width="905" height="100" rx="8" fill="#edf3ff" stroke="#d3e0f7"/>
<text x="357" y="465" font-size="20" font-weight="600" fill="#245cca">跨库提交规则</text>
<text x="357" y="500" font-size="18" font-weight="400" fill="#17283f">业务提交成功后填写 projected_at；重放时核对来源唯一键与 hash。</text>
<rect x="40" y="570" width="1200" height="124" rx="8" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="62" y="605" font-size="22" font-weight="600" fill="#17283f">启动对账</text>
<text x="62" y="643" font-size="19" font-weight="400" fill="#17283f">后台按每批 500 条核对 ready 来源；片段首次 ready 时递增 input_revision。</text>
<text x="62" y="675" font-size="18" font-weight="400" fill="#607088">设备接收确认与 WAV / ASR 任务独立运行。</text>
</g>
</svg>
