<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="970" viewBox="0 0 1280 970">
<title>Clip 与 Web 的收件交接</title>
<rect width="1280" height="970" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">Clip 与 Web 的收件交接</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">Clip 验证后信任上报字段，用 ready JSON 交接；不建来源或上传表。</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="150" width="570" height="210" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="150" width="5" height="210" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="62" y="184" font-size="21" font-weight="600" fill="#17283f">1 · Clip Server 完成接入</text>
<text x="62" y="220" font-size="18" font-weight="400" fill="#607088">本地授权文件验证设备凭证与归属</text>
<text x="62" y="248" font-size="18" font-weight="400" fill="#607088">相信已验证上报，核对实际 size/hash</text>
<text x="62" y="276" font-size="18" font-weight="400" fill="#607088">原件 fsync 后原子发布 ready JSON</text>
<text x="62" y="304" font-size="18" font-weight="400" fill="#607088">不连接数据库，不建 Clip 表</text>
<rect x="650" y="150" width="590" height="210" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="650" y="150" width="5" height="210" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="672" y="184" font-size="21" font-weight="600" fill="#17283f">2 · Web Server 读取 ready 来源</text>
<text x="672" y="220" font-size="18" font-weight="400" fill="#607088">校验归属、原件和处理限额</text>
<text x="672" y="248" font-size="18" font-weight="400" fill="#607088">复制 raw 与来源描述到两音频盘</text>
<text x="672" y="276" font-size="18" font-weight="400" fill="#607088">两份均 hash / fsync 通过再继续</text>
<text x="672" y="304" font-size="18" font-weight="400" fill="#607088">来源未就绪或双盘异常时暂停</text>
<rect x="40" y="405" width="570" height="210" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="405" width="5" height="210" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="62" y="439" font-size="21" font-weight="600" fill="#17283f">3 · 文件锁内幂等导入</text>
<text x="62" y="475" font-size="18" font-weight="400" fill="#607088">固定 state.lock 排他锁 + 进程内 mutex</text>
<text x="62" y="503" font-size="18" font-weight="400" fill="#607088">按来源 ID 去重，按会话聚合录音</text>
<text x="62" y="531" font-size="18" font-weight="400" fill="#607088">原子更新 recording.json 及内容版本</text>
<text x="62" y="559" font-size="18" font-weight="400" fill="#607088">按确定 ID 补齐 decode / asr job</text>
<rect x="650" y="405" width="590" height="210" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="650" y="405" width="5" height="210" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="672" y="439" font-size="21" font-weight="600" fill="#17283f">4 · 文件对账与幂等重放</text>
<text x="672" y="475" font-size="18" font-weight="400" fill="#607088">录音和所需 job 全部 fsync 后完成</text>
<text x="672" y="503" font-size="18" font-weight="400" fill="#607088">ready 来源文件保持不可变</text>
<text x="672" y="531" font-size="18" font-weight="400" fill="#607088">再扫描同一来源时按身份去重</text>
<text x="672" y="559" font-size="18" font-weight="400" fill="#607088">无需 projected_at 或已消费表</text>
<rect x="40" y="660" width="1200" height="210" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="660" width="5" height="210" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="62" y="694" font-size="21" font-weight="600" fill="#17283f">崩溃与服务停止</text>
<text x="62" y="730" font-size="18" font-weight="400" fill="#607088">Clip 停止：Web 可导入/解码，ASR 暂停；Web 停止：Clip 仍可收件。</text>
<text x="62" y="758" font-size="18" font-weight="400" fill="#607088">录音写成但 job 未创建：Web 启动对账，按确定 ID 补建；不重复新增录音。</text>
<text x="62" y="786" font-size="18" font-weight="400" fill="#607088">ready 文件与原件不一致：拒绝导入并告警；同来源不同内容不能覆盖。</text>
<text x="62" y="814" font-size="18" font-weight="400" fill="#607088">启动分批扫描全部 ready JSON；不依赖数据库登记来源或消费进度。</text>
</g>
</svg>
