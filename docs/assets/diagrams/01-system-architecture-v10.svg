<text x="365.0" y="214" text-anchor="middle" font-size="19" font-weight="400" fill="white">原始 Opus 与录完声明</text>
<rect x="970" y="330" width="470" height="140" rx="6" fill="#6b7280" stroke="#6b7280" stroke-width="2"/>
<text x="1205.0" y="370" text-anchor="middle" font-size="25" font-weight="600" fill="white">Nginx（OP管理）</text>
<text x="1205.0" y="399" text-anchor="middle" font-size="16" font-weight="400" fill="#edf4fb">外部服务</text>
<text x="1205.0" y="434" text-anchor="middle" font-size="19" font-weight="400" fill="white">HTTPS入口与反向代理</text>
<rect x="1510" y="660" width="260" height="140" rx="6" fill="#6b7280" stroke="#6b7280" stroke-width="2"/>
<text x="1640.0" y="700" text-anchor="middle" font-size="25" font-weight="600" fill="white">Google OIDC</text>
<text x="1640.0" y="729" text-anchor="middle" font-size="16" font-weight="400" fill="#edf4fb">外部服务</text>
<text x="1640.0" y="764" text-anchor="middle" font-size="19" font-weight="400" fill="white">外部身份服务</text>
<rect x="130" y="660" width="470" height="240" rx="6" fill="#1168bd" stroke="#1168bd" stroke-width="2"/>
<text x="365.0" y="700" text-anchor="middle" font-size="25" font-weight="600" fill="white">Clip Server</text>
<text x="365.0" y="729" text-anchor="middle" font-size="16" font-weight="400" fill="#edf4fb">设备接入 / 音频处理</text>
<text x="365.0" y="764" text-anchor="middle" font-size="19" font-weight="400" fill="white">Opus → 分段WAV → 转写</text>
<text x="365.0" y="791" text-anchor="middle" font-size="19" font-weight="400" fill="white">按recording合并完整WAV / VTT / MD</text>
<text x="365.0" y="818" text-anchor="middle" font-size="19" font-weight="400" fill="white">发布成品；不连接数据库</text>
<rect x="970" y="660" width="470" height="240" rx="6" fill="#1168bd" stroke="#1168bd" stroke-width="2"/>
<text x="1205.0" y="700" text-anchor="middle" font-size="25" font-weight="600" fill="white">Web Server</text>
