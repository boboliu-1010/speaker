<text x="560.0" y="1281" text-anchor="middle" font-size="19" font-weight="400" fill="white">用户 / Clip / recording ID确定目录位置</text>
<text x="560.0" y="1308" text-anchor="middle" font-size="19" font-weight="400" fill="white">完整WAV / VTT / MD及录音信息</text>
<text x="560.0" y="1335" text-anchor="middle" font-size="19" font-weight="400" fill="white">Clip负责处理和发布；Web只读成品、写设备授权</text>
