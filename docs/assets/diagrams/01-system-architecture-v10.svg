<text x="1205.0" y="764" text-anchor="middle" font-size="19" font-weight="400" fill="white">管理用户设备及授权文件</text>
<text x="1205.0" y="791" text-anchor="middle" font-size="19" font-weight="400" fill="white">只读完整录音、播放与下载</text>
<text x="1205.0" y="818" text-anchor="middle" font-size="19" font-weight="400" fill="white">不解码、不转写、不合并</text>
