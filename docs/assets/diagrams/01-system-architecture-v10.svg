<text x="1265.0" y="1361" text-anchor="middle" font-size="19" font-weight="400" fill="white">accounts / devices 两张表</text>
<text x="1265.0" y="1388" text-anchor="middle" font-size="19" font-weight="400" fill="white">仅 Web Server 访问</text>
