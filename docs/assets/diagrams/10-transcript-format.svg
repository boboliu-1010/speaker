<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790">
<title>识别原文的存储格式</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">识别原文的存储格式</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">SQLite recordings.transcript_json；UTF-8 JSON v1</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="159" width="685" height="542" rx="8" fill="#10233c" stroke="#10233c"/>
<text x="64" y="198" font-size="18" font-weight="400" fill="#e1ecfa">{</text>
<text x="64" y="233" font-size="18" font-weight="400" fill="#e1ecfa">  &quot;schema_version&quot;: 1,</text>
<text x="64" y="268" font-size="18" font-weight="400" fill="#e1ecfa">  &quot;time_unit&quot;: &quot;ms&quot;,</text>
<text x="64" y="303" font-size="18" font-weight="400" fill="#e1ecfa">  &quot;cues&quot;: [</text>
<text x="64" y="338" font-size="18" font-weight="400" fill="#e1ecfa">    {</text>
<text x="64" y="373" font-size="18" font-weight="400" fill="#e1ecfa">      &quot;cue_index&quot;: 1,</text>
<text x="64" y="408" font-size="18" font-weight="400" fill="#e1ecfa">      &quot;start_ms&quot;: 0,</text>
<text x="64" y="443" font-size="18" font-weight="400" fill="#e1ecfa">      &quot;end_ms&quot;: 2400,</text>
<text x="64" y="478" font-size="18" font-weight="400" fill="#e1ecfa">      &quot;speaker&quot;: &quot;A&quot;,</text>
<text x="64" y="513" font-size="18" font-weight="400" fill="#e1ecfa">      &quot;text&quot;: &quot;我们确认一下今天的安排。&quot;</text>
<text x="64" y="548" font-size="18" font-weight="400" fill="#e1ecfa">    }</text>
<text x="64" y="583" font-size="18" font-weight="400" fill="#e1ecfa">  ]</text>
<text x="64" y="618" font-size="18" font-weight="400" fill="#e1ecfa">}</text>
<rect x="775" y="159" width="465" height="213" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="775" y="159" width="465" height="48" rx="0" fill="#17283f" stroke="#17283f"/>
<text x="793" y="191" font-size="21" font-weight="600" fill="white">字段约定</text>
<rect x="776" y="207" width="463" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="791" y="229" font-size="16" font-weight="400" fill="#17283f">cue_index       从 1 开始的连续整数</text>
<text x="791" y="260" font-size="16" font-weight="400" fill="#17283f">start_ms        当前 WAV 的起始毫秒</text>
<rect x="776" y="269" width="463" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="791" y="291" font-size="16" font-weight="400" fill="#17283f">end_ms          当前 WAV 的结束毫秒</text>
<text x="791" y="322" font-size="16" font-weight="400" fill="#17283f">speaker         A / B / C… 或 null</text>
<rect x="776" y="331" width="463" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="791" y="353" font-size="16" font-weight="400" fill="#17283f">text            UTF-8 识别原文</text>
<rect x="775" y="445" width="465" height="154" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="775" y="445" width="5" height="154" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="797" y="479" font-size="21" font-weight="600" fill="#17283f">存储与导出</text>
<text x="797" y="515" font-size="18" font-weight="400" fill="#607088">录音行保存 owner 和 transcript_revision</text>
<text x="797" y="543" font-size="18" font-weight="400" fill="#607088">API 补充录音 ID、版本和分页游标</text>
<text x="797" y="571" font-size="18" font-weight="400" fill="#607088">VTT / Markdown 由同组 cues 生成</text>
<text x="40" y="752" font-size="19" font-weight="400" fill="#607088">整份 JSON 上限 8 MiB；API 每页最多 200 cues；静音结果保存为空数组。</text>
</g>
</svg>
