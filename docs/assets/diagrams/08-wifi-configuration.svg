<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
<title>设备接入与 BLE 适配</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">设备接入与 BLE 适配</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">凭证与归属由 Server 管理；网络扫描和连接由 Clip 执行</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="155" width="600" height="573" rx="8" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="62" y="194" font-size="25" font-weight="600" fill="#17283f">Web 设备控制器</text>
<rect x="62" y="219" width="556" height="213" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="62" y="219" width="556" height="48" rx="0" fill="#17283f" stroke="#17283f"/>
<text x="80" y="251" font-size="21" font-weight="600" fill="white">devices.mjs / ClipAdapter</text>
<rect x="63" y="267" width="554" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="78" y="289" font-size="16" font-weight="400" fill="#17283f">连接 generation 与命令串行队列</text>
<text x="78" y="320" font-size="16" font-weight="400" fill="#17283f">readIdentity() / capabilities()</text>
<rect x="63" y="329" width="554" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="78" y="351" font-size="16" font-weight="400" fill="#17283f">writeUploadConfiguration() / 读回确认</text>
<text x="78" y="382" font-size="16" font-weight="400" fill="#17283f">scanWifi() / saveWifi() / readWifiStatus()</text>
<rect x="63" y="391" width="554" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="78" y="413" font-size="16" font-weight="400" fill="#17283f">断开连接：取消旧命令与密码引用</text>
<rect x="62" y="480" width="556" height="205" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="62" y="480" width="5" height="205" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="84" y="514" font-size="21" font-weight="600" fill="#17283f">服务端调用</text>
<text x="84" y="550" font-size="18" font-weight="400" fill="#607088">activate(uid, evidence)：核验登记与归属</text>
<text x="84" y="578" font-size="18" font-weight="400" fill="#607088">binding/confirm：核对配置 revision/hash</text>
<text x="84" y="606" font-size="18" font-weight="400" fill="#607088">rename：限定本人 active binding</text>
<text x="84" y="634" font-size="18" font-weight="400" fill="#607088">remove：撤销上传凭证与清理配置</text>
<rect x="800" y="155" width="440" height="220" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="800" y="155" width="5" height="220" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="822" y="189" font-size="21" font-weight="600" fill="#17283f">Clip 固件 / BLE</text>
<text x="822" y="225" font-size="18" font-weight="400" fill="#607088">完整 UID、固件版本与 capability</text>
<text x="822" y="253" font-size="18" font-weight="400" fill="#607088">写入上传参数、校时、配置读回</text>
<text x="822" y="281" font-size="18" font-weight="400" fill="#607088">扫描 SSID / rssi / security</text>
<text x="822" y="309" font-size="18" font-weight="400" fill="#607088">保存网络、建立连接、返回错误</text>
<rect x="800" y="442" width="440" height="220" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="800" y="442" width="5" height="220" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="822" y="476" font-size="21" font-weight="600" fill="#17283f">Server / registry</text>
<text x="822" y="512" font-size="18" font-weight="400" fill="#607088">owner / binding / epoch / credential</text>
<text x="822" y="540" font-size="18" font-weight="400" fill="#607088">设备受控登记与配置 revision</text>
<text x="822" y="568" font-size="18" font-weight="400" fill="#607088">别名、凭证撤销、cleanup_pending</text>
<text x="822" y="596" font-size="18" font-weight="400" fill="#607088">历史来源与录音归属</text>
<line x1="640" y1="290" x2="800" y2="290" stroke="#087f74" stroke-width="2"/>
<text x="688" y="272" font-size="18" font-weight="600" fill="#087f74">BLE</text>
<line x1="640" y1="555" x2="800" y2="555" stroke="#245cca" stroke-width="2"/>
<text x="668" y="536" font-size="18" font-weight="600" fill="#245cca">HTTPS API</text>
<text x="40" y="780" font-size="18" font-weight="400" fill="#607088">SSID 取自当前连接的扫描结果；保存状态、连接状态和 Server 收件状态分别读取。</text>
</g>
</svg>
