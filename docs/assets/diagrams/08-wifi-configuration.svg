<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790">
<title>Clip Wi-Fi 配置界面</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">Clip Wi-Fi 配置界面</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">附近网络由目标 Clip 扫描，Web 负责选择与配置</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="155" width="690" height="563" rx="8" fill="white" stroke="#d8e0ea"/>
<text x="65" y="199" font-size="25" font-weight="600" fill="#17283f">设置 Wi-Fi</text>
<rect x="567" y="171" width="138" height="30" rx="5" fill="#e9f1ff" stroke="#e9f1ff"/>
<text x="579" y="192" font-size="15" font-weight="500" fill="#245cca">重新扫描</text>
<text x="65" y="242" font-size="18" font-weight="400" fill="#607088">附近网络</text>
<rect x="65" y="261" width="640" height="53" rx="8" fill="#edf3ff" stroke="#d8e0ea"/>
<text x="83" y="295" font-size="19" font-weight="400" fill="#17283f">●  Office-WiFi</text>
<text x="493" y="295" font-size="16" font-weight="400" fill="#607088">WPA2    -48 dBm</text>
<rect x="65" y="322" width="640" height="53" rx="8" fill="white" stroke="#d8e0ea"/>
<text x="83" y="356" font-size="19" font-weight="400" fill="#17283f">○  Meeting-Room</text>
<text x="493" y="356" font-size="16" font-weight="400" fill="#607088">WPA2    -61 dBm</text>
<rect x="65" y="383" width="640" height="53" rx="8" fill="white" stroke="#d8e0ea"/>
<text x="83" y="417" font-size="19" font-weight="400" fill="#17283f">○  Studio</text>
<text x="493" y="417" font-size="16" font-weight="400" fill="#607088">WPA2    -73 dBm</text>
<text x="65" y="488" font-size="18" font-weight="400" fill="#607088">网络密码</text>
<rect x="65" y="503" width="640" height="49" rx="8" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="83" y="536" font-size="22" font-weight="400" fill="#607088">••••••••••••</text>
<rect x="65" y="581" width="164" height="30" rx="5" fill="#e9f1ff" stroke="#e9f1ff"/>
<text x="77" y="602" font-size="15" font-weight="500" fill="#245cca">保存并连接</text>
<text x="251" y="605" font-size="17" font-weight="400" fill="#17283f">状态：已保存 / 连接中 / 已连接 / 失败原因</text>
<rect x="825" y="197" width="415" height="166" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="825" y="197" width="5" height="166" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="847" y="231" font-size="21" font-weight="600" fill="#17283f">ReSpeaker Clip</text>
<text x="847" y="267" font-size="18" font-weight="400" fill="#607088">扫描 SSID / 信号 / 安全类型</text>
<text x="847" y="295" font-size="18" font-weight="400" fill="#607088">保存网络配置并建立连接</text>
<text x="847" y="323" font-size="18" font-weight="400" fill="#607088">返回保存结果与实际连接状态</text>
<rect x="825" y="416" width="415" height="192" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="825" y="416" width="5" height="192" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="847" y="450" font-size="21" font-weight="600" fill="#17283f">BLE 连接</text>
<text x="847" y="486" font-size="18" font-weight="400" fill="#607088">Web 与目标设备直接通信</text>
<text x="847" y="514" font-size="18" font-weight="400" fill="#607088">密码在写入完成后清空</text>
<text x="847" y="542" font-size="18" font-weight="400" fill="#607088">已保存网络按设备容量展示</text>
<text x="847" y="570" font-size="18" font-weight="400" fill="#607088">无线基线：2.4 GHz WPA2</text>
<line x1="730" y1="315" x2="825" y2="315" stroke="#087f74" stroke-width="2"/>
<text x="746" y="293" font-size="18" font-weight="600" fill="#087f74">BLE</text>
<text x="40" y="758" font-size="16" font-weight="400" fill="#607088">界面中的网络名称与信号强度为示意数据。</text>
</g>
</svg>
