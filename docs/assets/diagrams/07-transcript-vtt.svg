<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740">
<title>版本与读取约束</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">版本与读取约束</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">recordings 固定当前音频与文字版本；各接口在读取快照内校验</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="56" y="166" font-size="21" font-weight="600" fill="#17283f">校验对象</text>
<text x="376" y="166" font-size="21" font-weight="600" fill="#17283f">固定字段</text>
<text x="766" y="166" font-size="21" font-weight="600" fill="#17283f">读取条件</text>
<rect x="40" y="195" width="1200" height="68" rx="0" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="56" y="237" font-size="17" font-weight="400" fill="#17283f">WAV</text>
<text x="376" y="237" font-size="17" font-weight="400" fill="#17283f">wav_job_id / audio_revision</text>
<text x="766" y="237" font-size="17" font-weight="400" fill="#17283f">job.kind=decode；文件 ready</text>
<rect x="40" y="263" width="1200" height="68" rx="0" fill="white" stroke="#d8e0ea"/>
<text x="56" y="305" font-size="17" font-weight="400" fill="#17283f">转写 JSON</text>
<text x="376" y="305" font-size="17" font-weight="400" fill="#17283f">transcript_json / transcript_revision</text>
<text x="766" y="305" font-size="17" font-weight="400" fill="#17283f">文字 ready；版本等于 audio_revision</text>
<rect x="40" y="331" width="1200" height="68" rx="0" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="56" y="373" font-size="17" font-weight="400" fill="#17283f">VTT</text>
<text x="376" y="373" font-size="17" font-weight="400" fill="#17283f">vtt_job_id / transcript_revision</text>
<text x="766" y="373" font-size="17" font-weight="400" fill="#17283f">job.kind=transcribe；文件 ready</text>
<rect x="40" y="399" width="1200" height="68" rx="0" fill="white" stroke="#d8e0ea"/>
<text x="56" y="441" font-size="17" font-weight="400" fill="#17283f">Markdown</text>
<text x="376" y="441" font-size="17" font-weight="400" fill="#17283f">当前 JSON 的全部 cues</text>
<text x="766" y="441" font-size="17" font-weight="400" fill="#17283f">同一 SQLite 快照内迭代</text>
<rect x="40" y="467" width="1200" height="68" rx="0" fill="#f3f6fa" stroke="#d8e0ea"/>
<text x="56" y="509" font-size="17" font-weight="400" fill="#17283f">文字分页</text>
<text x="376" y="509" font-size="17" font-weight="400" fill="#17283f">recording_id / revision / last_cue_index</text>
<text x="766" y="509" font-size="17" font-weight="400" fill="#17283f">每页最多 200；游标属于当前录音</text>
<rect x="40" y="574" width="580" height="107" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="574" width="5" height="107" rx="0" fill="#245cca" stroke="#245cca"/>
<text x="62" y="608" font-size="21" font-weight="600" fill="#17283f">版本变化</text>
<text x="62" y="644" font-size="18" font-weight="400" fill="#607088">返回 409 recording_revision_changed</text>
<rect x="650" y="574" width="590" height="107" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="650" y="574" width="5" height="107" rx="0" fill="#087f74" stroke="#087f74"/>
<text x="672" y="608" font-size="21" font-weight="600" fill="#17283f">Web 处理</text>
<text x="672" y="644" font-size="18" font-weight="400" fill="#607088">取消旧请求与音频，重新固定版本后取齐文字</text>
</g>
</svg>
