<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910">
<title>业务数据关系</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">业务数据关系</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">四张业务表；设备绑定和来源索引复用 registry</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="160" width="355" height="244" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="160" width="355" height="48" rx="0" fill="#17283f" stroke="#17283f"/>
<text x="58" y="192" font-size="21" font-weight="600" fill="white">accounts</text>
<rect x="41" y="208" width="353" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="56" y="230" font-size="16" font-weight="400" fill="#17283f">PK  user_id</text>
<text x="56" y="261" font-size="16" font-weight="400" fill="#17283f">UK  google_sub</text>
<rect x="41" y="270" width="353" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="56" y="292" font-size="16" font-weight="400" fill="#17283f">UK  email</text>
<text x="56" y="323" font-size="16" font-weight="400" fill="#17283f">display_name / status</text>
<rect x="41" y="332" width="353" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="56" y="354" font-size="16" font-weight="400" fill="#17283f">auth_version / last_login_at</text>
<text x="56" y="385" font-size="16" font-weight="400" fill="#17283f">created_at / updated_at</text>
<rect x="460" y="160" width="780" height="213" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="460" y="160" width="780" height="48" rx="0" fill="#17283f" stroke="#17283f"/>
<text x="478" y="192" font-size="21" font-weight="600" fill="white">recordings</text>
<rect x="461" y="208" width="778" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="476" y="230" font-size="16" font-weight="400" fill="#17283f">PK  id                      FK  owner → accounts.user_id</text>
<text x="476" y="261" font-size="16" font-weight="400" fill="#17283f">input_revision / audio_revision / transcript_revision</text>
<rect x="461" y="270" width="778" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="476" y="292" font-size="16" font-weight="400" fill="#17283f">transcript_json             版本化原文</text>
<text x="476" y="323" font-size="16" font-weight="400" fill="#17283f">wav_job_id / vtt_job_id      当前文件任务指针</text>
<rect x="461" y="332" width="778" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="476" y="354" font-size="16" font-weight="400" fill="#17283f">recorded_at / duration_ms / audio_state / transcript_state</text>
<rect x="40" y="575" width="565" height="182" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="40" y="575" width="565" height="48" rx="0" fill="#17283f" stroke="#17283f"/>
<text x="58" y="607" font-size="21" font-weight="600" fill="white">recording_segments</text>
<rect x="41" y="623" width="563" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="56" y="645" font-size="16" font-weight="400" fill="#17283f">PK  id                     FK  recording_id / owner</text>
<text x="56" y="676" font-size="16" font-weight="400" fill="#17283f">UK  source_namespace + source_id</text>
<rect x="41" y="685" width="563" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="56" y="707" font-size="16" font-weight="400" fill="#17283f">raw_relative_path / size_bytes / sha256</text>
<text x="56" y="738" font-size="16" font-weight="400" fill="#17283f">segment_no / state / imported_at</text>
<rect x="665" y="575" width="575" height="182" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="665" y="575" width="575" height="48" rx="0" fill="#17283f" stroke="#17283f"/>
<text x="683" y="607" font-size="21" font-weight="600" fill="white">jobs</text>
<rect x="666" y="623" width="573" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="681" y="645" font-size="16" font-weight="400" fill="#17283f">PK  id                     FK  recording_id / owner</text>
<text x="681" y="676" font-size="16" font-weight="400" fill="#17283f">UK  recording_id + input_revision + kind</text>
<rect x="666" y="685" width="573" height="31" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="681" y="707" font-size="16" font-weight="400" fill="#17283f">kind / state / attempt / lease_token / lease_until</text>
<text x="681" y="738" font-size="16" font-weight="400" fill="#17283f">publication_state / path / size_bytes / sha256</text>
<line x1="395" y1="270" x2="460" y2="270" stroke="#245cca" stroke-width="2"/>
<text x="405" y="252" font-size="16" font-weight="400" fill="#245cca">1:N</text>
<line x1="710" y1="373" x2="710" y2="480" stroke="#245cca" stroke-width="2"/>
<line x1="710" y1="480" x2="325" y2="480" stroke="#245cca" stroke-width="2"/>
<line x1="325" y1="480" x2="325" y2="575" stroke="#245cca" stroke-width="2"/>
<text x="342" y="520" font-size="17" font-weight="400" fill="#607088">一条录音，多个原始片段</text>
<line x1="1000" y1="373" x2="1000" y2="575" stroke="#245cca" stroke-width="2"/>
<text x="1017" y="485" font-size="17" font-weight="400" fill="#607088">1:N  处理任务</text>
<text x="40" y="856" font-size="18" font-weight="400" fill="#607088">复合外键校验录音、owner 和版本；jobs.kind 区分 WAV 解码与 VTT 转写产物。</text>
</g>
</svg>
