<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<title>设备添加界面</title>
<rect width="1280" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="40" y="55" font-size="30" font-weight="600" fill="#17283f">设备添加界面</text>
<text x="40" y="88" font-size="17" font-weight="400" fill="#607088">四步向导；每一步展示设备返回结果</text>
<line x1="40" y1="112" x2="1240" y2="112" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="40" y="156" width="285" height="450" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="62" y="179" width="70" height="30" rx="5" fill="#e9f1ff" stroke="#e9f1ff"/>
<text x="74" y="200" font-size="15" font-weight="500" fill="#245cca">1 / 4</text>
<text x="62" y="257" font-size="24" font-weight="600" fill="#17283f">准备设备</text>
<text x="62" y="310" font-size="18" font-weight="400" fill="#17283f">Clip 保持开机</text>
<line x1="62" y1="326" x2="300" y2="326" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="62" y="354" font-size="18" font-weight="400" fill="#17283f">浏览器开启蓝牙</text>
<line x1="62" y1="370" x2="300" y2="370" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="62" y="398" font-size="18" font-weight="400" fill="#17283f">设备靠近电脑</text>
<line x1="62" y1="414" x2="300" y2="414" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="62" y="533" width="241" height="43" rx="8" fill="#edf3ff" stroke="#edf3ff"/>
<text x="76" y="561" font-size="18" font-weight="500" fill="#245cca">开始连接</text>
<rect x="345" y="156" width="285" height="450" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="367" y="179" width="70" height="30" rx="5" fill="#e9f1ff" stroke="#e9f1ff"/>
<text x="379" y="200" font-size="15" font-weight="500" fill="#245cca">2 / 4</text>
<text x="367" y="257" font-size="24" font-weight="600" fill="#17283f">连接 Clip</text>
<text x="367" y="310" font-size="18" font-weight="400" fill="#17283f">选择 BLE 设备</text>
<line x1="367" y1="326" x2="605" y2="326" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="367" y="354" font-size="18" font-weight="400" fill="#17283f">显示完整 UID</text>
<line x1="367" y1="370" x2="605" y2="370" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="367" y="398" font-size="18" font-weight="400" fill="#17283f">读取固件和能力</text>
<line x1="367" y1="414" x2="605" y2="414" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="367" y="533" width="241" height="43" rx="8" fill="#edf3ff" stroke="#edf3ff"/>
<text x="381" y="561" font-size="18" font-weight="500" fill="#245cca">已连接</text>
<rect x="650" y="156" width="285" height="450" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="672" y="179" width="70" height="30" rx="5" fill="#e9f1ff" stroke="#e9f1ff"/>
<text x="684" y="200" font-size="15" font-weight="500" fill="#245cca">3 / 4</text>
<text x="672" y="257" font-size="24" font-weight="600" fill="#17283f">配置上传</text>
<text x="672" y="310" font-size="18" font-weight="400" fill="#17283f">核验设备登记与归属</text>
<line x1="672" y1="326" x2="910" y2="326" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="672" y="354" font-size="18" font-weight="400" fill="#17283f">写入上传凭证</text>
<line x1="672" y1="370" x2="910" y2="370" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="672" y="398" font-size="18" font-weight="400" fill="#17283f">读回 binding / epoch</text>
<line x1="672" y1="414" x2="910" y2="414" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="672" y="442" font-size="18" font-weight="400" fill="#17283f">同步设备时间</text>
<line x1="672" y1="458" x2="910" y2="458" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="672" y="533" width="241" height="43" rx="8" fill="#edf3ff" stroke="#edf3ff"/>
<text x="686" y="561" font-size="18" font-weight="500" fill="#245cca">配置已确认</text>
<rect x="955" y="156" width="285" height="450" rx="8" fill="white" stroke="#d8e0ea"/>
<rect x="977" y="179" width="70" height="30" rx="5" fill="#e9f1ff" stroke="#e9f1ff"/>
<text x="989" y="200" font-size="15" font-weight="500" fill="#245cca">4 / 4</text>
<text x="977" y="257" font-size="24" font-weight="600" fill="#17283f">设置 Wi-Fi</text>
<text x="977" y="310" font-size="18" font-weight="400" fill="#17283f">Clip 扫描附近网络</text>
<line x1="977" y1="326" x2="1215" y2="326" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="977" y="354" font-size="18" font-weight="400" fill="#17283f">选择 SSID，输入密码</text>
<line x1="977" y1="370" x2="1215" y2="370" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="977" y="398" font-size="18" font-weight="400" fill="#17283f">BLE 写入配置</text>
<line x1="977" y1="414" x2="1215" y2="414" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="977" y="442" font-size="18" font-weight="400" fill="#17283f">显示实际连接结果</text>
<line x1="977" y1="458" x2="1215" y2="458" stroke="#d8e0ea" stroke-width="1.5"/>
<rect x="977" y="533" width="241" height="43" rx="8" fill="#edf3ff" stroke="#edf3ff"/>
<text x="991" y="561" font-size="18" font-weight="500" fill="#245cca">连接成功，完成</text>
<text x="40" y="666" font-size="18" font-weight="400" fill="#607088">交付核对：可信登记、上传凭证写入、设备配置读回、校时、Wi-Fi 连接与真实收件。</text>
</g>
</svg>
